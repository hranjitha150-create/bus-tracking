{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}College Bus Tracking{% endblock %}</title><link rel="stylesheet" href="{% static 'css/site.css' %}">{% block head %}{% endblock %}</head>
<body class="{% block body_class %}{% endblock %}"><header><a href="{% url 'dashboard' %}">College Bus Tracking</a>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
